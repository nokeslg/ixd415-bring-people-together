<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Group 3 Test Room</title>
<style>
	:root {
		--bg: #f6f4ef;
		--panel: #ffffff;
		--ink: #1c1b19;
		--muted: #75716a;
		--line: #e4e0d7;
		--accent: #2f6df6;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; overflow: hidden; }
	body {
		font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif;
		background: var(--bg);
		color: var(--ink);
		-webkit-user-select: none;
		user-select: none;
		touch-action: none;
	}
	#board {
		position: fixed;
		inset: 0;
		background-image: radial-gradient(var(--line) 1.2px, transparent 1.2px);
		background-size: 22px 22px;
		cursor: crosshair;
	}
	.sticker {
		position: absolute;
		font-size: 34px;
		line-height: 1;
		transform: translate(-50%, -50%);
		pointer-events: none;
		animation: pop 0.25s ease-out;
	}
	@keyframes pop { from { transform: translate(-50%, -50%) scale(0.2); } }
	.cursor {
		position: absolute;
		pointer-events: none;
		transition: left 0.08s linear, top 0.08s linear;
		z-index: 5;
	}
	.cursor svg { display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
	.cursor span {
		position: absolute;
		left: 14px;
		top: 16px;
		padding: 2px 7px;
		border-radius: 8px;
		color: #fff;
		font-size: 12px;
		font-weight: 700;
		white-space: nowrap;
	}

	header {
		position: fixed;
		top: 12px;
		left: 12px;
		right: 12px;
		display: flex;
		justify-content: space-between;
		align-items: flex-start;
		gap: 10px;
		pointer-events: none;
		z-index: 10;
	}
	.card {
		pointer-events: auto;
		background: var(--panel);
		border: 1px solid var(--line);
		border-radius: 14px;
		box-shadow: 0 2px 10px rgba(0,0,0,.06);
		padding: 10px 12px;
	}
	.title { font-weight: 800; font-size: 15px; }
	.sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
	.count { display: flex; align-items: center; gap: 6px; font-size: 14px; }
	.count b { font-size: 20px; }
	.dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; }
	.dot.live { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.25); }
	.people { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; max-width: 220px; }
	.chip { font-size: 11px; font-weight: 700; color: #fff; padding: 2px 7px; border-radius: 8px; }
	button {
		font: inherit;
		font-weight: 700;
		font-size: 12px;
		border: none;
		border-radius: 8px;
		padding: 6px 10px;
		white-space: nowrap;
		cursor: pointer;
	}
	.primary { background: var(--accent); color: #fff; }
	.ghost { background: #efece5; color: var(--ink); }
	.row { display: flex; gap: 6px; margin-top: 8px; }

	footer {
		position: fixed;
		left: 50%;
		bottom: max(14px, env(safe-area-inset-bottom));
		transform: translateX(-50%);
		display: flex;
		gap: 4px;
		padding: 6px;
		z-index: 10;
		max-width: calc(100vw - 24px);
		overflow-x: auto;
	}
	.emoji {
		font-size: 24px;
		width: 42px;
		height: 42px;
		padding: 0;
		background: transparent;
		border-radius: 10px;
		flex: none;
	}
	.emoji.on { background: #e6eeff; outline: 2px solid var(--accent); }

	#toast {
		position: fixed;
		left: 50%;
		bottom: 90px;
		transform: translateX(-50%);
		background: var(--ink);
		color: #fff;
		font-size: 13px;
		padding: 7px 12px;
		border-radius: 10px;
		opacity: 0;
		transition: opacity .2s;
		pointer-events: none;
		z-index: 20;
	}
	#toast.show { opacity: 1; }

	#welcome {
		position: fixed;
		inset: 0;
		display: grid;
		place-items: center;
		background: rgba(246,244,239,.85);
		backdrop-filter: blur(4px);
		z-index: 30;
	}
	#welcome form { width: min(320px, calc(100vw - 32px)); }
	#welcome h1 { font-size: 22px; margin: 0 0 4px; }
	#welcome p { color: var(--muted); font-size: 14px; margin: 0 0 14px; line-height: 1.4; }
	#welcome input {
		width: 100%;
		font: inherit;
		font-size: 16px;
		padding: 10px 12px;
		border: 1px solid var(--line);
		border-radius: 10px;
		margin-bottom: 10px;
	}
	#welcome button { width: 100%; padding: 11px; font-size: 15px; }
</style>
</head>
<body>
<div id="board"></div>

<header>
	<div class="card">
		<div class="title">Group 3 Test Room</div>
		<div class="sub" id="roomLabel"></div>
		<div class="row">
			<button class="primary" id="invite">Copy invite link</button>
			<button class="ghost" id="clear">Clear</button>
		</div>
	</div>
	<div class="card">
		<div class="count"><span class="dot" id="dot"></span><b id="count">0</b><span id="countWord">people here</span></div>
		<div class="people" id="people"></div>
	</div>
</header>

<footer class="card" id="palette"></footer>
<div id="toast"></div>

<div id="welcome">
	<form class="card" id="nameForm">
		<h1>👋 Hey</h1>
		<p>Everyone with this link is on the same board. Tap to drop a sticker, and watch other people's cursors move.</p>
		<input id="nameInput" maxlength="20" placeholder="Your name" autocomplete="off" />
		<button class="primary" type="submit">Join</button>
	</form>
</div>

<script>
	const EMOJI = ['⭐', '❤️', '😂', '🔥', '👋', '🎉', '👀', '🌮', '🐸', '💀']
	const params = new URLSearchParams(location.search)
	const room = (params.get('room') || 'lobby').toLowerCase().replace(/[^a-z0-9-]/g, '-').slice(0, 40)

	const $ = (id) => document.getElementById(id)
	const board = $('board')
	$('roomLabel').textContent = 'room: ' + room

	let me = null
	let myName = ''
	try { myName = localStorage.getItem('g3-name') || '' } catch {}
	let picked = EMOJI[0]
	const users = new Map()
	const cursors = new Map()

	// Emoji palette
	for (const e of EMOJI) {
		const b = document.createElement('button')
		b.className = 'emoji' + (e === picked ? ' on' : '')
		b.textContent = e
		b.onclick = (ev) => {
			ev.stopPropagation()
			picked = e
			document.querySelectorAll('.emoji').forEach((x) => x.classList.toggle('on', x.textContent === e))
		}
		$('palette').appendChild(b)
	}

	function toast(text) {
		const t = $('toast')
		t.textContent = text
		t.classList.add('show')
		clearTimeout(toast.timer)
		toast.timer = setTimeout(() => t.classList.remove('show'), 1600)
	}

	// Connection (reconnects automatically if wifi blips)
	let ws
	let retry = 0
	function connect() {
		const proto = location.protocol === 'https:' ? 'wss' : 'ws'
		ws = new WebSocket(`${proto}://${location.host}/parties/room/${room}`)
		ws.onopen = () => {
			retry = 0
			$('dot').classList.add('live')
			if (myName) send({ type: 'name', name: myName })
		}
		ws.onclose = () => {
			$('dot').classList.remove('live')
			users.clear()
			cursors.forEach((c) => c.remove())
			cursors.clear()
			renderPeople()
			setTimeout(connect, Math.min(5000, 500 * 2 ** retry++))
		}
		ws.onmessage = (ev) => handle(JSON.parse(ev.data))
	}
	const send = (msg) => ws && ws.readyState === 1 && ws.send(JSON.stringify(msg))

	function handle(msg) {
		if (msg.type === 'init') {
			me = msg.you
			users.clear()
			msg.users.forEach((u) => users.set(u.id, u))
			board.querySelectorAll('.sticker').forEach((s) => s.remove())
			msg.stickers.forEach(addSticker)
			users.forEach(drawCursor)
		} else if (msg.type === 'join') {
			users.set(msg.user.id, msg.user)
			drawCursor(msg.user)
		} else if (msg.type === 'leave') {
			const u = users.get(msg.id)
			users.delete(msg.id)
			cursors.get(msg.id)?.remove()
			cursors.delete(msg.id)
			if (u && u.name !== 'Guest') toast(u.name + ' left')
		} else if (msg.type === 'name') {
			const u = users.get(msg.id)
			if (u) {
				const isNew = u.name === 'Guest'
				u.name = msg.name
				drawCursor(u)
				if (isNew && msg.id !== me) toast(msg.name + ' joined')
			}
		} else if (msg.type === 'move') {
			const u = users.get(msg.id)
			if (u) { u.x = msg.x; u.y = msg.y; drawCursor(u) }
		} else if (msg.type === 'drop') {
			addSticker(msg.sticker)
		} else if (msg.type === 'clear') {
			board.querySelectorAll('.sticker').forEach((s) => s.remove())
			toast(msg.by + ' cleared the board')
		}
		renderPeople()
	}

	function addSticker(s) {
		const el = document.createElement('div')
		el.className = 'sticker'
		el.textContent = s.emoji
		el.style.left = s.x * 100 + '%'
		el.style.top = s.y * 100 + '%'
		el.title = s.by
		board.appendChild(el)
	}

	function drawCursor(u) {
		if (u.id === me) return
		let el = cursors.get(u.id)
		if (!el) {
			el = document.createElement('div')
			el.className = 'cursor'
			el.innerHTML = `<svg width="18" height="22" viewBox="0 0 18 22"><path d="M1 1l15 11-7 1-4 7z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg><span></span>`
			board.appendChild(el)
			cursors.set(u.id, el)
		}
		el.querySelector('path').setAttribute('fill', u.color)
		const label = el.querySelector('span')
		label.textContent = u.name
		label.style.background = u.color
		el.style.left = u.x * 100 + '%'
		el.style.top = u.y * 100 + '%'
	}

	function renderPeople() {
		const n = users.size
		$('count').textContent = n
		$('countWord').textContent = n === 1 ? 'person here' : 'people here'
		const box = $('people')
		box.innerHTML = ''
		users.forEach((u) => {
			const c = document.createElement('span')
			c.className = 'chip'
			c.style.background = u.color
			c.textContent = u.id === me ? (u.name + ' (you)') : u.name
			box.appendChild(c)
		})
	}

	// Pointer → normalized board coordinates, so phones and laptops line up
	const norm = (e) => ({ x: e.clientX / board.clientWidth, y: e.clientY / board.clientHeight })
	let lastMove = 0
	board.addEventListener('pointermove', (e) => {
		const now = performance.now()
		if (now - lastMove < 40) return
		lastMove = now
		send({ type: 'move', ...norm(e) })
	})
	board.addEventListener('pointerdown', (e) => {
		const p = norm(e)
		send({ type: 'move', ...p })
		send({ type: 'drop', emoji: picked, ...p })
	})

	$('invite').onclick = async () => {
		const url = location.origin + location.pathname + '?room=' + room
		try { await navigator.clipboard.writeText(url); toast('Invite link copied') }
		catch { prompt('Copy this link:', url) }
	}
	$('clear').onclick = () => { if (confirm('Clear every sticker for everyone?')) send({ type: 'clear' }) }

	// Name screen
	$('nameInput').value = myName
	$('nameForm').onsubmit = (e) => {
		e.preventDefault()
		myName = $('nameInput').value.trim().slice(0, 20) || 'Guest'
		try { localStorage.setItem('g3-name', myName) } catch {}
		$('welcome').remove()
		send({ type: 'name', name: myName })
	}

	connect()
</script>
</body>
</html>
